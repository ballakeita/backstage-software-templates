name: ${{ values.app_name }}-cicd
"on":
  push:
    paths:
      - src/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Shorten ID commit
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: {% raw %}${{ secrets.DOCKERHUB_USERNAME }}{% endraw %}
          password: {% raw %}${{ secrets.DOCKERHUB_TOKEN }}{% endraw %}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          # Ici on mixe une variable Backstage et une variable GitHub Actions raw
          tags: papoucha/${{ values.app_name }}:{% raw %}${{ env.COMMIT_ID }}{% endraw %}
    outputs:
      commit_id: {% raw %}${{ env.COMMIT_ID }}{% endraw %}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Modify values file
        shell: bash
        run: |
          echo {% raw %}${{ needs.ci.outputs.commit_id }}{% endraw %}
          sudo apt-get update && sudo apt-get install -y pipx
          pipx install yq
          yq -Yi '.image.tag = "{% raw %}${{ needs.ci.outputs.commit_id }}{% endraw %}"' charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml

      - name: Commit et Push des changements
        uses: EndBug/add-and-commit@v10
        with:
          message: "Update values.yaml with commit {% raw %}${{ needs.ci.outputs.commit_id }}{% endraw %}"

      - name: install argocd
        shell: bash
        run: |
          curl -k -sSL -o argocd  https://argocd-server.argocd/download/argocd-linux-amd64
          ls -lh
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd app  sync
        shell: bash
        run: |
          argocd login argocd-server.argocd  \
          --insecure \
          --grpc-web \
          --username admin  \
          --password {% raw %}${{ secrets.ARGOCD_PASSWORD }}{% endraw %}
      - name: sync app
        run: |
          argocd app sync ${{ values.app_name }}